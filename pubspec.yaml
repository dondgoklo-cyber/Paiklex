name: monolith_tasks
description: Local-First Task Manager
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Database
  drift: ^2.15.0
  sqlite3_flutter_libs: ^0.5.21
  path_provider: ^2.1.2
  path: ^1.9.0

  # Routing
  go_router: ^13.2.0

  # DI (manual only)
  get_it: ^7.6.7

  # Functional programming
  fpdart: ^1.1.0

  # Notifications (совместимо с Flutter 3.19)
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2

  # Utils
  uuid: ^4.3.3
  intl: ^0.18.1
  logger: ^2.0.2+1
  shared_preferences: ^2.2.2
  collection: ^1.18.0
  rxdart: ^0.27.7

  # File operations
  file_picker: ^6.1.1
  share_plus: ^7.2.2

  # Calendar (3.0.x совместим с intl 0.18)
  table_calendar: ^3.0.9

  # Pull to refresh
  pull_to_refresh: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

  build_runner: ^2.4.8
  drift_dev: ^2.15.0

  mocktail: ^1.0.3
  bloc_test: ^9.1.5
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
