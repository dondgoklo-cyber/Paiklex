name: monolith_tasks
description: Local-First Task Manager
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Database
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Routing
  go_router: ^14.2.7

  # DI (only get_it)
  get_it: ^7.7.0

  # Functional programming
  fpdart: ^1.1.0

  # Notifications
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # Utils
  uuid: ^4.5.1
  intl: ^0.19.0
  logger: ^2.4.0
  shared_preferences: ^2.3.2
  collection: ^1.18.0
  rxdart: ^0.28.0

  # File ops
  file_picker: ^8.1.2
  share_plus: ^10.0.2

  # Calendar
  table_calendar: ^3.1.2

  # Pull to refresh
  pull_to_refresh: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  build_runner: ^2.4.13
  drift_dev: ^2.20.0

  mocktail: ^1.0.4
  bloc_test: ^9.1.7
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
