pluginManagement {
    def flutterSdkPath = flutterProjectRoot.resolve('../..')
    plugins {
        id "dev.flutter.flutter-gradle-plugin" version "1.0"
    }
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'monolith_tasks'
include ':app'
