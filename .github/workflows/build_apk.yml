name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Flutter version check
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Generate localization
        run: flutter gen-l10n || echo "⚠️ Localization generation skipped (may already be generated)"

      - name: Build runner
        run: |
          dart run build_runner clean
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        run: flutter analyze || true

      - name: Build Debug APK
        run: flutter build apk --debug --verbose

      - name: Build Release APK
        run: flutter build apk --release --verbose

      - name: List build artifacts
        run: |
          echo "=== Build artifacts ==="
          find build/app/outputs -name "*.apk" -type f || echo "No APK files found"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monolith-apks
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Build summary
        if: always()
        run: |
          echo "## 🏗️ Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Generated APK files:" >> $GITHUB_STEP_SUMMARY
          find build/app/outputs -name "*.apk" -type f -exec ls -lh {} \; >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No APK files generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### How to download:" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to Actions tab" >> $GITHUB_STEP_SUMMARY
          echo "2. Click on this workflow run" >> $GITHUB_STEP_SUMMARY
          echo "3. Scroll down to 'Artifacts' section" >> $GITHUB_STEP_SUMMARY
          echo "4. Download 'monolith-apks'" >> $GITHUB_STEP_SUMMARY
