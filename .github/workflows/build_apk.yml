name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - name: Fix Android structure using flutter create
        run: |
          cd /tmp
          flutter create -t app paiklex_temp
          cd $GITHUB_WORKSPACE
          rm -rf android
          cp -r /tmp/paiklex_temp/android ./android
          sed -i 's/com.example.paiklex_temp/com.example.monolith_tasks/g' android/app/build.gradle
          mkdir -p android/app/src/main/kotlin/com/example/monolith_tasks
          cp /tmp/paiklex_temp/android/app/src/main/kotlin/com/example/paiklex_temp/MainActivity.kt \
             android/app/src/main/kotlin/com/example/monolith_tasks/
          sed -i 's/package com.example.paiklex_temp/package com.example.monolith_tasks/g' \
             android/app/src/main/kotlin/com/example/monolith_tasks/MainActivity.kt
          rm -rf /tmp/paiklex_temp

      - name: Flutter version check
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Generate localization
        run: flutter gen-l10n

      - name: Build runner
        run: |
          dart run build_runner clean
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        run: flutter analyze || true

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Build Release APK
        run: flutter build apk --release

      - name: Verify APK exists
        run: |
          if [ ! -f build/app/outputs/flutter-apk/app-release.apk ]; then
            echo "\u274c Release APK not found!"
            ls -la build/app/outputs/
            exit 1
          fi
          echo "\u2705 Release APK found: $(ls -lh build/app/outputs/flutter-apk/app-release.apk)"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: monolith-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30