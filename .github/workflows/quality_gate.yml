name: Flutter Quality Gate

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  quality-gate:
    name: Full Flutter Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - name: Flutter version check
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Generate localization
        run: flutter gen-l10n

      - name: Run build_runner
        run: |
          dart run build_runner clean
          dart run build_runner build --delete-conflicting-outputs

      - name: Dart format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Verify APK exists
        run: |
          if [ ! -f build/app/outputs/flutter-apk/app-release.apk ]; then
            echo "Release APK not found!"
            ls -la build/app/outputs/
            exit 1
          fi
          echo "Release APK found: $(ls -lh build/app/outputs/flutter-apk/app-release.apk)"

      - name: Build Release AAB
        run: flutter build appbundle --release

      - name: Verify AAB exists
        run: |
          if [ ! -f build/app/outputs/bundle/release/app-release.aab ]; then
            echo "Release AAB not found!"
            ls -la build/app/outputs/
            exit 1
          fi
          echo "Release AAB found: $(ls -lh build/app/outputs/bundle/release/app-release.aab)"

      - name: Build Web Release
        run: flutter build web --release

      - name: Verify Web build exists
        run: |
          if [ ! -d build/web ]; then
            echo "Web build directory not found!"
            ls -la build/
            exit 1
          fi
          echo "Web build directory found"
